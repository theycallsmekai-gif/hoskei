name: Build ByteExternal

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "=== Installed Xcode Applications ==="
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          else
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Resolve Dependencies
        run: |
          if [ -f Podfile ]; then
            echo "Installing CocoaPods dependencies..."
            pod install
          fi

      - name: Build Archive (Unsigned)
        run: |
          mkdir -p build/logs
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ByteExternal.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee build/logs/xcodebuild.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ByteExternal.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ByteExternal-unsigned.ipa Payload
          cd ..
          ls -lh build/ByteExternal-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteExternal-unsigned-ipa
          path: build/ByteExternal-unsigned.ipa
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/
          retention-days: 14
